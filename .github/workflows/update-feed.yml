name: Update
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout main ──────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      # ── 2. Cache & Download ArxivFeed binary ──────────
      - name: Cache ArxivFeed
        id: cache-arxivfeed
        uses: actions/cache@v4
        with:
          path: ./arxivfeed
          key: ${{ runner.os }}-arxivfeed-v1

      - name: Download ArxivFeed
        if: steps.cache-arxivfeed.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
          REPO: "NotCraft/ArxivFeed"
          VERSION: "latest"
          MATCH: "arxivfeed-.+-x86_64-unknown-linux-musl.tar.gz$"
          RENAME: "arxivfeed.tgz"
        shell: bash
        run: |
          curl -sL --fail \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
              "https://api.github.com/repos/${REPO}/releases/${VERSION}" \
              | jq -r ".assets | .[] | select(.name | test(\"${MATCH}\")) | .url" \
              | tee asset.url
          curl -sL --fail \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
              -o "${RENAME}" \
              "$(cat asset.url)"
          tar -zxvf arxivfeed.tgz --strip-components 1 $(tar tf arxivfeed.tgz | grep /arxivfeed)
          chmod +x arxivfeed

      # ── 3. Set up Python ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Build HTML + cache.json ────────────────────
      - name: Build rss
        run: python scripts/run_arxivfeed_serial.py

      # ── 5. Restore embedding cache ────────────────────
      - name: Restore embedding cache
        id: embedding-cache
        uses: actions/cache/restore@v4
        with:
          path: data/embeddings.json
          key: ${{ runner.os }}-embedding-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-embedding-cache-

      # ── 6. Seed embedding cache during Git-to-cache migration ──
      - name: Seed embedding cache from previous commit
        run: |
          mkdir -p data
          if [ ! -f data/embeddings.json ]; then
            git show HEAD^:data/embeddings.json > data/embeddings.json 2>/dev/null || true
          fi

      # ── 7. Ensure data/ exists ────────────────────────
      - name: Ensure data directory
        run: |
          mkdir -p data
          [ -f data/embeddings.json ] || echo "{}" > data/embeddings.json

      # ── 8. Generate Graph Data (Semantic Embedding) ───
      - name: Generate Graph Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_graph.py

      # ── 9. Save embedding cache ───────────────────────
      - name: Save embedding cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/embeddings.json
          key: ${{ steps.embedding-cache.outputs.cache-primary-key }}

      # ── 10. Generate RSS Feed ─────────────────────────
      - name: Generate RSS Feed
        run: python scripts/generate_rss.py

      # ── 11. Generate AI Summaries ─────────────────────
      - name: Generate AI Summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_summary.py

      # ── 12. Fetch paper figures (Semantic Scholar) ────
      - name: Fetch Paper Figures
        run: python scripts/generate_figures.py

      # ── 13. Fetch Umami site stats ────────────────────
      - name: Fetch Site Stats
        env:
          UMAMI_API_TOKEN: ${{ secrets.UMAMI_API_TOKEN }}
        run: python scripts/generate_site_stats.py

      # ── 14. Fetch citation graph (Semantic Scholar) ───
      - name: Fetch Citations
        run: python scripts/generate_citations.py

      # ── 15. Deploy to GitHub Pages ────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true

      # ── 16. Telegram notification ─────────────────────
      - name: Notify Telegram
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py
